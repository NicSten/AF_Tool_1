name: Verify field survey tool
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Validate offline cache matches application sources
        run: |
          node tools/gen-sw.mjs
          git diff --exit-code -- sw.js
